/* ---- Primitives that replace the shadcn/Radix components (Tabs, ToggleGroup, Dialog, Sheet, Toaster) ---- */
.tabs-list{display:inline-flex;align-items:center;justify-content:center;height:36px;width:fit-content;border-radius:8px;background:#f1f4f9;color:#6c7b90;padding:3px}
.tabs-list>button{display:inline-flex;flex:1;align-items:center;justify-content:center;gap:6px;height:100%;border-radius:6px;border:1px solid transparent;padding:4px 8px;font-size:14px;font-weight:500;white-space:nowrap;color:#6c7b90}
.tabs-list>button[data-state=active]{background:#fff;color:#1b2940;box-shadow:0 1px 2px #0000000d}
.toggle-group{display:inline-flex;align-items:center}
[data-slot=toggle-group-item]{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:36px;height:36px;padding:0 8px;font-size:14px;font-weight:500;white-space:nowrap;color:#1b2940;border-radius:6px;flex-shrink:0}
[data-slot=toggle-group-item] svg{pointer-events:none}
.member-copy>.text-button{display:flex}
[data-slot=toggle-group-item]:hover{background:#f1f4f9}
[data-slot=toggle-group-item][data-state=on]{background:#eff4ff}
.layer{position:fixed;inset:0;z-index:50}
.overlay{position:absolute;inset:0;background:#0f1a2c66;animation:fade .15s ease-out}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 2rem);max-width:512px;display:grid;gap:16px;border:1px solid #e2e8f1;background:#fff;padding:24px;border-radius:10px;box-shadow:0 18px 44px #1b294026;animation:pop .16s ease-out}
.dialog-close{position:absolute;top:14px;right:14px;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:6px;color:#8190a8;opacity:.8}
.dialog-close:hover{background:#eef2f9;color:#456fbf;opacity:1}
[data-slot=dialog-header],[data-slot=alert-dialog-header]{display:flex;flex-direction:column;gap:2px;padding-right:28px}
[data-slot=dialog-title],[data-slot=alert-dialog-title]{font-size:18px;font-weight:600;line-height:1.35;color:#1b2940}
[data-slot=dialog-description],[data-slot=alert-dialog-description]{font-size:14px;color:#6c7b90;line-height:1.7}
[data-slot=alert-dialog-footer]{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.alert-dialog{max-width:470px!important}
.sheet{position:absolute;top:0;right:0;bottom:0;height:100%;display:flex;flex-direction:column;background:#fff;border-left:1px solid #e2e8f1;box-shadow:-12px 0 40px #1b29401f;animation:slide-in .25s ease-out;padding-top:env(safe-area-inset-top,0px)}
.sheet-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:7px;color:#8190a8;background:#fff}
.sheet-close:hover{background:#eef2f9;color:#456fbf}
[data-slot=sheet-header]{display:flex;flex-direction:column;gap:4px}
[data-slot=sheet-title]{font-weight:600;color:#1b2940}
[data-slot=sheet-description]{font-size:14px;color:#6c7b90}
.toaster{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:70;display:flex;flex-direction:column;gap:10px;width:min(370px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid #e2e8f1;border-left:3px solid #3865e8;border-radius:9px;padding:12px 14px;box-shadow:0 10px 28px #1b29401f;font-size:13px;color:#1b2940;line-height:1.6;animation:toast-in .2s ease-out}
.toast.success{border-left-color:#5e9f7f;background:#f2faf6;color:#2f6a4c}
.toast.error{border-left-color:#c27a70;background:#fff4f2;color:#9a4a40}
.toast.warning{border-left-color:#d9a251;background:#fff8ec;color:#8a622a}
.toast>div{flex:1;min-width:0}.toast strong{font-weight:600;display:block;overflow-wrap:anywhere}.toast p{margin-top:2px;font-size:12px;opacity:.85}
.toast>button{font-size:12px;font-weight:600;border:1px solid currentColor;border-radius:6px;padding:4px 8px;white-space:nowrap;background:#ffffffaa;flex-shrink:0}
.toast>.toast-x{border:0;background:transparent;padding:2px;opacity:.6}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}}@keyframes slide-in{from{transform:translateX(24px);opacity:0}}@keyframes toast-in{from{transform:translateY(-8px);opacity:0}}

/* ---- Quick task entry (tasks tab), inline field chips and the small change popover ---- */

.quick-task-hint{font-size:12px;color:#9aacc5;margin:8px 0 0 31px}
button.field-chip{cursor:pointer;border-radius:5px;padding:1px 5px;margin:-1px -5px;transition:background .15s,color .15s}
button.field-chip:hover{background:#eef3ff;color:#3b63b8}

.sp-bar>i{display:block;height:100%;border-radius:3px;background:#8ea8e6}

.free-none{font-size:13px;color:#6d8a78;line-height:1.6}
.sched-free>small{font-size:11px;color:#8aa596}
.strip{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.strip-labels{display:flex;flex-direction:column;gap:6px;padding-top:20px}

.strip-line{position:absolute;top:20px;bottom:6px;width:1px;background:#eef2f8}
.strip-free{position:absolute;top:20px;bottom:6px;background:#e5f5ec99;border-left:1px dashed #9fd3b3;border-right:1px dashed #9fd3b3}
.strip-now{position:absolute;top:16px;bottom:2px;width:2px;margin-left:-1px;background:#e0775f;border-radius:1px;z-index:2}
.strip-track{position:relative;height:30px;margin-bottom:6px;background:#f7f9fd80;border-radius:6px}
.strip-block{position:absolute;top:3px;bottom:3px;border-radius:5px;padding:0 6px;font-size:11px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;min-width:6px;z-index:1}
.strip-block.lhs{background:#dfe8ff;color:#3f63c4;border:1px solid #c6d5fb}
.strip-block.kjs{background:#f7ead5;color:#936a2c;border:1px solid #eed8b2}
.strip-block.joint{background:#3865e8;color:#fff;border:1px solid #2f58d0}
.strip-block.private{background:repeating-linear-gradient(45deg,#eef1f6,#eef1f6 4px,#e3e8ef 4px,#e3e8ef 8px);color:#7f8da3;border:1px solid #dde3ec}
.strip-block.allday{opacity:.55;z-index:0}
.strip-block:hover{filter:brightness(.97)}
.agenda{margin:0;padding:0;border:1px solid #eaf0f6;border-radius:10px;overflow:hidden;background:#fff}
.agenda-line{display:flex;align-items:stretch}
.agenda-line+.agenda-line{border-top:1px solid #eef2f8}
.agenda-head{background:#f8fafd}
.agenda-colhead{flex:1 1 50%;min-width:0;display:flex;align-items:center;gap:7px;padding:8px 12px;font-size:13px;color:#40516b}
.agenda-colhead>strong{font-size:14px;font-weight:600;color:#2f4468}
.agenda-colhead>.you-tag{margin-left:0}
.agenda-colhead>small{margin-left:auto;font-size:12px;color:#8fa2bd;white-space:nowrap}
.agenda-cols{display:flex;align-items:stretch}
.agenda-col{flex:1 1 50%;min-width:0;display:flex;flex-direction:column}
.agenda-col+.agenda-col{border-left:1px solid #eef2f8}
.agenda-col>.agenda-row{border-top:1px solid #eef2f8;min-height:48px}
.agenda-row{display:flex;align-items:center;gap:10px;flex:1 1 50%;min-width:0;text-align:left;padding:10px 12px}
.agenda-col>.agenda-row{flex:0 0 auto}
.agenda-row:hover{background:#f8faff}
.agenda-row.blank,.agenda-row.blank:hover{background:#fcfdff;cursor:default}
.agenda-row.joint,.agenda-row.span{flex-basis:100%}
.agenda-row.joint{background:#f4f7ff;box-shadow:inset 3px 0 0 #3865e8}
.slot-add{color:#a4b3c9;font-size:13px;gap:8px}
.slot-add>.slot-plus{width:26px;height:26px;border-radius:8px;border:1px dashed #cdd8e8;display:inline-flex;align-items:center;justify-content:center;color:#a4b3c9;flex-shrink:0}
.slot-add:hover{background:#f6f9ff;color:#3865e8}
.slot-add:hover>.slot-plus{border-color:#a3bbf5;border-style:solid;color:#3865e8;background:#edf3ff}
.slot-form{background:#f6f9ff;gap:6px;padding:7px 10px;flex-wrap:wrap}
.slot-form:hover{background:#f6f9ff}
.slot-times{display:inline-flex;align-items:center;gap:3px;flex-shrink:0;font-size:12px;color:#8196b4}
.slot-form input[type=time]{flex:none;width:auto;height:32px;border:1px solid #d6dfec;border-radius:7px;padding:0 6px;font-size:13px;background:#fff;color:#3f5a85;font-variant-numeric:tabular-nums}
.slot-form input[type=time]::-webkit-calendar-picker-indicator{display:none}
.slot-title{flex:1 1 140px;min-width:0;height:32px;border:1px solid #d6dfec;border-radius:7px;padding:0 9px;font-size:14px;background:#fff;color:#334866}
.slot-title:focus,.slot-form input[type=time]:focus{outline:none;border-color:#a3bbf5;box-shadow:0 0 0 2px #e5edff!important}
.slot-ok,.slot-cancel{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.slot-ok{background:#3865e8;color:#fff}.slot-ok:disabled{background:#c9d5ec;opacity:1}
.slot-cancel{color:#8fa2bd}.slot-cancel:hover{background:#e9eef7}
.agenda-joint{border-top:1px solid #eef2f8}
.agenda-joint-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f8fafd;font-size:13px;color:#40516b;border-bottom:1px solid #eef2f8}
.agenda-joint-head>strong{font-size:14px;font-weight:600;color:#2f4468}
.agenda-joint-head>small{font-size:12px;color:#8fa2bd;margin-left:auto;text-align:right}
.agenda-joint>.agenda-line+.agenda-line{border-top:1px solid #eef2f8}
.agenda-joint .agenda-row.task-due{background:#fbfcfe;box-shadow:inset 3px 0 0 #b9c6e0}
.agenda-joint .agenda-time>strong{font-size:14px}
.agenda-joint .tag.todo,.agenda-joint .tag.doing,.agenda-joint .tag.hold,.agenda-joint .tag.done{font-size:12px;padding:2px 7px}
.agenda-row.private .agenda-title{color:#8a97ab}
.agenda-row.task-due{background:#fbfcfe}
.agenda-time{display:flex;align-items:baseline;gap:1px;width:92px;flex-shrink:0;font-variant-numeric:tabular-nums}
.agenda-time>strong{font-size:15px;font-weight:600;color:#3f5a85}
.agenda-time>small{font-size:12px;color:#8196b4}
.agenda-title{display:flex;align-items:center;gap:7px;min-width:0;flex:1;font-size:15px;color:#40516b}
.agenda-title>span:not(.tag){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.agenda-title>svg{color:#9aa8bd;flex-shrink:0}
.agenda-title>.tag{font-size:12px;padding:2px 7px;flex-shrink:0;display:inline-flex;align-items:center;gap:3px}
.who-pair{display:inline-flex;flex-shrink:0}.who-pair>.avatar+.avatar{margin-left:-5px;box-shadow:0 0 0 2px #fff}
.agenda-row>.avatar{flex-shrink:0}
.agenda .avatar.mini{width:26px;height:26px;border-radius:8px;font-size:11px}
.agenda-colhead>.avatar.mini{width:22px;height:22px;border-radius:7px}
.date-tabs>.is-sat:not(.is-today)>span{color:#5b86e5}
.date-tabs>.is-sun:not(.is-today)>span{color:#d0685c}
.ws-header>span.is-sat{color:#5b86e5}
.ws-header>span.is-sun{color:#d0685c}
.agenda-empty{font-size:14px;color:#8196b4;line-height:1.7;padding:14px;border:1px dashed #dfe6f1;border-radius:10px;background:#fafbfd}
.event-add{margin:0;box-shadow:none}
.time-pair{display:inline-flex;align-items:center;gap:3px;background:#f5f8ff;border:1px solid #e5edf9;border-radius:7px;padding:1px 7px;flex-shrink:0;color:#8aa0bf;font-size:13px}
.time-pair.off{opacity:.45}
.quick-compose .time-pair>input{flex:none!important;width:76px!important;min-width:0!important;font-size:13px!important;color:#556f94;padding:4px 0!important;font-variant-numeric:tabular-nums}
.time-pair>input::-webkit-calendar-picker-indicator{display:none}
.story-heading{margin-top:2px}
.story-topics{margin:2px 0 14px}
.story-topics>.topic-filter-row{margin-top:0}
.carry-line{display:flex;align-items:center;gap:10px;width:100%;margin-top:18px;padding:12px 15px;border:1px dashed #d5dfee;border-radius:10px;background:#fafbfe;color:#6d809e;font-size:14px;text-align:left}

.carry-line>em{margin-left:auto;font-style:normal;display:inline-flex;align-items:center;gap:4px;color:#5f7fb8;font-size:13px;white-space:nowrap}

.root-links{margin:14px 0 22px;padding:12px 14px;border:1px solid #e6edf8;border-radius:10px;background:#fafcff}
.root-links-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:#7086a6;font-weight:500;margin-bottom:6px}

.root-link{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #eef2f8;min-width:0}

.detail-footer{margin-top:28px;padding-top:16px;border-top:1px solid #edf1f7}

@media(max-width:640px){.schedule-card{padding:14px 13px;gap:12px;margin-bottom:24px}.sched-summary{gap:8px}.sched-person,.sched-free{padding:10px}.sp-mood{display:none}.sp-load{flex-direction:column;gap:0;font-size:12px}.strip-tick.odd>span{display:none}.strip-block{font-size:0;padding:0}.agenda-row{gap:8px;padding:9px 10px}.agenda-col>.agenda-row.ev{flex-direction:column;align-items:flex-start;gap:3px}.agenda-col>.agenda-row.ev>.agenda-title{align-self:stretch}.agenda-col .agenda-time{width:auto;line-height:1.3}.agenda-joint .agenda-time{width:76px;flex-direction:column;align-items:flex-start;gap:0}.agenda-time>strong{font-size:14px}.agenda-title{font-size:14px;flex-wrap:wrap;gap:4px 7px}.agenda-colhead{padding:7px 10px;gap:6px}.agenda-colhead>strong{font-size:13px}.slot-form{padding:6px 8px}.slot-times{width:100%}.slot-form input[type=time]{flex:1 1 0}.agenda-joint-head{flex-wrap:wrap}.agenda-joint-head>small{margin-left:0;width:100%;text-align:left}.event-add .quick-compose{flex-wrap:wrap}.event-add .time-pair{order:1}.event-add .quick-compose>svg{display:none}.event-add .quick-compose>.icon-button{order:2;margin-left:auto}.event-add .quick-compose>.quick-submit{order:3}.event-add .quick-compose>input{order:4;flex:1 1 100%!important;padding:6px 0!important}.title-edit{font-size:22px}.root-link>small{display:none}.root-link-form{grid-template-columns:1fr}.carry-line{flex-wrap:wrap;font-size:13px}.carry-line>em{margin-left:26px}}
/* ---- Detail panel: title and description together, property grid, compact links ---- */

.save-state{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-size:12px}

.link-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px}
.link-chip{display:inline-flex;align-items:center;gap:2px;height:27px;padding:0 7px 0 8px;border:1px solid #dfe8f8;background:#f5f8ff;border-radius:6px;font-size:12px;color:#5476a8;max-width:100%;min-width:0}

.prop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:0 0 20px;padding-bottom:18px;border-bottom:1px solid #eaf0f8}
.prop{display:flex;flex-direction:column;gap:4px;min-width:0;margin:0}
.prop.wide{grid-column:1/-1}
.prop>dt{font-size:12px;color:#98abc6}
.prop>dd{margin:0;min-width:0}
.prop-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 7px 0 7px;border:1px solid #e0e7f2;border-radius:7px;background:#fff;font-size:14px;color:#556f94;max-width:100%;min-width:0}
.prop-chip:hover{border-color:#aec4f2;background:#f4f7ff}
